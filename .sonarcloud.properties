# Shipped code apart from the developer tools: the visual and action checks and
# the translation script in scripts/ are never packaged.
sonar.sources=usr,etc,data,pkgbuild
sonar.tests=tests,scripts
sonar.sourceEncoding=UTF-8
# GTK CSS: node names (window, headerbar, row, sheet…), states (:selected) and
# named colors are not web CSS, so the web CSS rules report them as unknown.
sonar.exclusions=usr/share/comm-welcome/style.css
